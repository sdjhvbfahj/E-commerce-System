<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 76" width="232" height="76" role="img" aria-label="621电商">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ef3f1a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#3a4157"/>
    </linearGradient>
  </defs>

  <!-- 品牌图形：圆角方章 + 621 -->
  <rect x="0" y="6" width="64" height="64" rx="19" fill="url(#brand)"/>
  <circle cx="15" cy="19" r="17" fill="#ffffff" opacity="0.14"/>
  <circle cx="56" cy="62" r="12" fill="#ffffff" opacity="0.10"/>
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="0.5"
    fill="#ffffff"
  >621</text>

  <!-- 品牌文字 -->
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="78" y="42" font-size="30" font-weight="800" fill="url(#ink)">621</text>
    <text x="132" y="42" font-size="30" font-weight="800" fill="#ef3f1a">电商</text>
    <text x="79" y="57" font-size="11" letter-spacing="2.2" fill="#9aa0b0">好物优选 · 快速直达</text>
  </g>
</svg>
